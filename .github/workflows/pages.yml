name: pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_docs.sh'
      - 'scripts/build_pages.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Sphinx dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build clean Pages artifact
        run: ./scripts/build_pages.sh
        env:
          # linkcheck 容错：文档含本机回环地址(127.0.0.1/localhost)与外部站点，
          # CI 沙箱网络不可达时不应阻断 Pages 构建。HTML 构建仍保持 -W 严格。
          BT_DOCS_ALLOW_LINKCHECK_WARN: '1'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify deployed site with Playwright
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bt_editor/package-lock.json
      - name: Install frontend dependencies
        working-directory: bt_editor
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: bt_editor
        run: npx playwright install --with-deps chromium
      - name: Smoke-test the deployed Pages URL
        working-directory: bt_editor
        env:
          BT_PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run verify:pages
